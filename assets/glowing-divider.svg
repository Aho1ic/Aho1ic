<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 12" width="860" height="12" role="img" aria-label="Glowing Cyber Divider">
  <defs>
    <linearGradient id="laser-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <animate attributeName="x1" values="-100%;100%" dur="3.4s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%;200%" dur="3.4s" repeatCount="indefinite" />
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.1" />
      <stop offset="36%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#3fb950" />
      <stop offset="64%" stop-color="#e0af68" />
      <stop offset="78%" stop-color="#bb9af3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>

    <filter id="beam-glow" x="-5%" y="-120%" width="110%" height="340%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <line x1="0" y1="6" x2="860" y2="6" stroke="#30363d" stroke-width="1" opacity="0.55" />
  <line x1="0" y1="6" x2="860" y2="6" stroke="url(#laser-beam)" stroke-width="1.8" />
  <line x1="0" y1="6" x2="860" y2="6" stroke="url(#laser-beam)" stroke-width="3.6" filter="url(#beam-glow)" opacity="0.55" />
</svg>
