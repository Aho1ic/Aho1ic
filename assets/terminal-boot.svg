<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 326" width="860" height="326" role="img" aria-label="Aho1ic Daemon Boot Terminal">
  <defs>
    <filter id="glow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="2.4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .mono {
        font-family: 'PingFang SC', 'PingFang TC', 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, sans-serif;
      }
      .line {
        opacity: 0;
        animation: fadeIn 0.28s ease-out forwards;
      }
      .l1 { animation-delay: 0.25s; }
      .l2 { animation-delay: 0.75s; }
      .l3 { animation-delay: 1.25s; }
      .l4 { animation-delay: 1.75s; }
      .l5 { animation-delay: 2.25s; }
      .l6 { animation-delay: 2.75s; }
      .l7 { animation-delay: 3.25s; }
      .l8 { animation-delay: 3.75s; }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      .cursor {
        opacity: 0;
        animation: cursorBlink 0.9s step-end infinite;
        animation-delay: 3.95s;
      }
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- macOS 终端窗口 -->
  <rect x="0.5" y="0.5" width="859" height="325" rx="12" fill="#0d1117" stroke="#30363d" />

  <!-- 标题栏 -->
  <path d="M1,12 Q1,1 12,1 L848,1 Q859,1 859,12 L859,40 L1,40 Z" fill="#161b22" />
  <line x1="1" y1="40.5" x2="859" y2="40.5" stroke="#30363d" />
  <circle cx="24" cy="21" r="6" fill="#ff5f56" />
  <circle cx="44" cy="21" r="6" fill="#ffbd2e" />
  <circle cx="64" cy="21" r="6" fill="#27c93f" />
  <text x="430" y="25" fill="#8b949e" font-size="12.5" text-anchor="middle" class="mono">aho1ic@nanjing: ~/workspace — zsh</text>
  <text x="838" y="25" fill="#3fb950" font-size="11.5" text-anchor="end" class="mono">● daemon</text>

  <!-- 左侧极简 Monogram 与色板 -->
  <g transform="translate(24, 62)">
    <rect x="0" y="0" width="144" height="238" rx="10" fill="#131923" stroke="#243042" />
    <text x="72" y="102" fill="#58a6ff" font-size="60" font-weight="700" text-anchor="middle" filter="url(#glow)" class="mono">&gt;_</text>
    <text x="72" y="136" fill="#e6edf3" font-size="15" font-weight="700" text-anchor="middle" class="mono">Aho1ic</text>
    <text x="72" y="158" fill="#8b949e" font-size="11.5" text-anchor="middle" class="mono">南京 · China</text>
    <text x="72" y="180" fill="#7982a9" font-size="11" text-anchor="middle" class="mono">macOS · Xcode</text>
    <text x="72" y="198" fill="#7982a9" font-size="11" text-anchor="middle" class="mono">Zed · CLI</text>
    <!-- 头像延伸 5 色块 -->
    <g transform="translate(27, 214)">
      <rect x="0" y="0" width="15" height="9" rx="2" fill="#1b3b5c" />
      <rect x="19" y="0" width="15" height="9" rx="2" fill="#58a6ff" />
      <rect x="38" y="0" width="15" height="9" rx="2" fill="#3fb950" />
      <rect x="57" y="0" width="15" height="9" rx="2" fill="#e0af68" />
      <rect x="76" y="0" width="15" height="9" rx="2" fill="#bb9af3" />
    </g>
  </g>

  <!-- 右侧逐行启动日志（双列固定 x 对齐，适配苹方与 JetBrains Mono） -->
  <g transform="translate(192, 80)" font-size="13.5" class="mono">
    <text x="0" y="0" class="line l1">
      <tspan fill="#3fb950" font-weight="700">$</tspan>
      <tspan fill="#e6edf3" dx="8">./aho1ic --boot --profile=full</tspan>
    </text>

    <text y="34" class="line l2">
      <tspan x="0" fill="#58a6ff" font-weight="600">[BOOT]</tspan>
      <tspan x="66" fill="#c9d1d9">Mounting </tspan>
      <tspan fill="#7aa2f7" font-weight="700">Aeroric</tspan>
      <tspan fill="#8b949e"> (Rust Core + Native SwiftUI macOS/iOS)</tspan>
    </text>

    <text y="66" class="line l3">
      <tspan x="0" fill="#3fb950" font-weight="600" filter="url(#glow)">[LINK]</tspan>
      <tspan x="66" fill="#c9d1d9">Agents linked: Claude Code · Codex · omp · DeepSeek Harness</tspan>
    </text>

    <text y="98" class="line l4">
      <tspan x="0" fill="#e0af68" font-weight="600">[NEXT]</tspan>
      <tspan x="66" fill="#c9d1d9">Warming </tspan>
      <tspan fill="#e0af68" font-weight="700">NexusMail</tspan>
      <tspan fill="#8b949e"> (Go + SwiftUI · Unified Mail &amp; TempMail)</tspan>
    </text>

    <text y="130" class="line l5">
      <tspan x="0" fill="#3fb950" font-weight="600" filter="url(#glow)">[MESH]</tspan>
      <tspan x="66" fill="#9ece6a" font-weight="700">Fylakie</tspan>
      <tspan fill="#c9d1d9"> WireGuard multi-VPS monitor online</tspan>
      <tspan fill="#8b949e"> (3s probe)</tspan>
    </text>

    <text y="162" class="line l6">
      <tspan x="0" fill="#bb9af3" font-weight="600" filter="url(#glow)">[SYNC]</tspan>
      <tspan x="66" fill="#bb9af3" font-weight="700">mimo-cpa</tspan>
      <tspan fill="#c9d1d9"> OpenAI / Anthropic SSE bridge active</tspan>
    </text>

    <text y="194" class="line l7">
      <tspan x="0" fill="#7982a9" font-weight="600">[CORE]</tspan>
      <tspan x="66" fill="#c9d1d9">Rust · Go · SwiftUI · TypeScript · SQLite · WireGuard</tspan>
    </text>

    <text y="226" class="line l8">
      <tspan x="0" fill="#2ac3de" font-weight="700" filter="url(#glow)">[LIVE]</tspan>
      <tspan x="66" fill="#e6edf3">Ready in Nanjing — building native tools &amp; agent infra.</tspan>
      <tspan fill="#58a6ff" dx="6" class="cursor">▮</tspan>
    </text>
  </g>
</svg>
