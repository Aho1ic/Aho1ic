name: Update Profile Visuals & Metrics

on:
  schedule:
    # 每天北京时间 08:00 (UTC 00:00) 自动刷新
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/generate_metrics.py"
      - ".github/workflows/profile-update.yml"

permissions:
  contents: write

jobs:
  update-metrics:
    name: Refresh Terminal Metrics SVG
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate metrics-terminal.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/generate_metrics.py \
            --user "${{ github.repository_owner }}" \
            --output assets/metrics-terminal.svg

      - name: Commit updated metrics SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet assets/metrics-terminal.svg; then
            echo "No changes to metrics-terminal.svg"
            exit 0
          fi
          git add assets/metrics-terminal.svg
          git commit -m "chore: refresh terminal metrics svg"
          git push

  generate-visuals:
    name: Generate 3D Contribution City & Snake
    runs-on: ubuntu-latest
    steps:
      - name: Generate Contribution Snake (Light & Dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#3fb950&color_dots=#161b22,#1b3b5c,#2563eb,#3b82f6,#58a6ff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Collect 3D SVG outputs into dist/
        run: |
          mkdir -p dist/profile-3d-contrib
          cp -r profile-3d-contrib/* dist/profile-3d-contrib/

      - name: Push all generated visuals to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
